name: Portfolio qualification

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - infra/bicep/environments/portfolio/**
      - .github/workflows/qualification-portfolio.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: portfolio-qualification
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify the portfolio deployment
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev

    env:
      BUDGET_ALERT_EMAIL: ${{ vars.BUDGET_ALERT_EMAIL }}
      OPERATIONAL_ALERT_EMAIL: ${{ vars.OPERATIONAL_ALERT_EMAIL }}
      SECURITY_ALERT_EMAIL: ${{ vars.SECURITY_ALERT_EMAIL }}
      COST_ALERT_EMAIL: ${{ vars.COST_ALERT_EMAIL }}
      SQL_ENTRA_ADMIN_OBJECT_ID: ${{ vars.SQL_ENTRA_ADMIN_OBJECT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      PLATFORM_ADMINISTRATORS_GROUP_OBJECT_ID: ${{ vars.PLATFORM_ADMINISTRATORS_GROUP_OBJECT_ID }}
      DEVELOPERS_GROUP_OBJECT_ID: ${{ vars.DEVELOPERS_GROUP_OBJECT_ID }}
      OPERATIONS_GROUP_OBJECT_ID: ${{ vars.OPERATIONS_GROUP_OBJECT_ID }}
      SECURITY_READERS_GROUP_OBJECT_ID: ${{ vars.SECURITY_READERS_GROUP_OBJECT_ID }}
      COST_READERS_GROUP_OBJECT_ID: ${{ vars.COST_READERS_GROUP_OBJECT_ID }}
      DATABASE_ADMINISTRATORS_GROUP_OBJECT_ID: ${{ vars.DATABASE_ADMINISTRATORS_GROUP_OBJECT_ID }}
      AUDITORS_GROUP_OBJECT_ID: ${{ vars.AUDITORS_GROUP_OBJECT_ID }}
      DEPLOY_PRINCIPAL_OBJECT_ID: ${{ vars.AZURE_DEPLOY_PRINCIPAL_OBJECT_ID }}
      EXPECTED_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      EXPECTED_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      PORTFOLIO_REPORT_DIRECTORY: reports/portfolio
      PORTFOLIO_MAX_RUNTIME_HOURS: '24'
      PORTFOLIO_MAX_ESTIMATED_COST_DKK: '600'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Bicep CLI
        run: az bicep install --version v0.46.1

      - name: Prepare portfolio evidence and budget period
        run: |
          set -euo pipefail
          mkdir -p reports/portfolio

          python3 - <<'PY' >>"$GITHUB_ENV"
          from datetime import datetime, timezone

          current = datetime.now(timezone.utc)
          print(f"PORTFOLIO_BUDGET_START_DATE={current:%Y-%m}-01T00:00:00Z")
          print(f"PORTFOLIO_BUDGET_END_DATE={current.year + 1}-{current:%m}-01T00:00:00Z")
          PY

      - name: Sign in with the deployment OIDC identity
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ secrets.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Select two compatible regions and a slot-capable App Service SKU
        run: |
          set -euo pipefail
          bash infra/bicep/environments/portfolio/qualify-regions.portfolio.sh \
            2>&1 | tee reports/portfolio/region-qualification.portfolio.log

      - name: Verify SQL administrator, identity, quotas and clean Azure state
        run: |
          set -euo pipefail
          bash infra/bicep/environments/portfolio/check-readiness.portfolio.sh \
            2>&1 | tee reports/portfolio/readiness.portfolio.log

      - name: Calculate short-lived deployment cost
        run: |
          set -euo pipefail
          bash infra/bicep/environments/portfolio/estimate-cost.portfolio.sh \
            2>&1 | tee reports/portfolio/cost-estimate.portfolio.log

      - name: Validate the complete deployment with Azure providers
        run: |
          set -euo pipefail

          az deployment sub validate \
            --name "nshop-portfolio-validate-${GITHUB_RUN_ID}" \
            --location "$PORTFOLIO_PRIMARY_LOCATION" \
            --parameters infra/bicep/environments/portfolio/main.portfolio.bicepparam \
            --validation-level Provider \
            --output none \
            2>&1 | tee reports/portfolio/provider-validation.portfolio.log

      - name: Run the exact portfolio What-If
        run: |
          set -euo pipefail

          az deployment sub what-if \
            --name "nshop-portfolio-what-if-${GITHUB_RUN_ID}" \
            --location "$PORTFOLIO_PRIMARY_LOCATION" \
            --parameters infra/bicep/environments/portfolio/main.portfolio.bicepparam \
            --validation-level Provider \
            --result-format FullResourcePayloads \
            --no-pretty-print \
            --output json \
            >reports/portfolio/what-if.portfolio.json \
            2>reports/portfolio/what-if.portfolio.stderr.txt

          delete_count="$(jq '[.changes[]? | select(.changeType == "Delete")] | length' reports/portfolio/what-if.portfolio.json)"
          if ((delete_count > 0)); then
            echo '::error::The portfolio What-If includes deletion changes.'
            exit 1
          fi

          jq -r '.changes[]? | [.changeType, .resourceId] | @tsv' \
            reports/portfolio/what-if.portfolio.json \
            >reports/portfolio/what-if-summary.portfolio.txt

          cat reports/portfolio/what-if-summary.portfolio.txt

      - name: Write qualification summary
        if: always()
        run: |
          {
            echo '## Portfolio deployment qualification'
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Qualification run: ${GITHUB_RUN_ID}"
            echo "- Primary region: ${PORTFOLIO_PRIMARY_LOCATION:-not selected}"
            echo "- Secondary region: ${PORTFOLIO_SECONDARY_LOCATION:-not selected}"
            echo "- App Service SKU: ${PORTFOLIO_APP_SERVICE_SKU:-not selected}"
            echo "- Estimated 24-hour cost: ${PORTFOLIO_ESTIMATED_COST_DKK:-not qualified} DKK"
            echo '- No Azure resources are created by this workflow.'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload portfolio qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: portfolio-qualification-evidence-${{ github.run_id }}
          path: reports/portfolio/
          if-no-files-found: warn
          retention-days: 30
