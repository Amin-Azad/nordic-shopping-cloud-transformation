name: Portfolio infrastructure validation

on:
  pull_request:
    paths:
      - infra/bicep/environments/portfolio/**
      - .github/workflows/*portfolio.yml
  push:
    branches:
      - main
    paths:
      - infra/bicep/environments/portfolio/**
      - .github/workflows/*portfolio.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-portfolio:
    name: Validate portfolio deployment profile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BUDGET_ALERT_EMAIL: ci-budget@example.invalid
      OPERATIONAL_ALERT_EMAIL: ci-operations@example.invalid
      SECURITY_ALERT_EMAIL: ci-security@example.invalid
      COST_ALERT_EMAIL: ci-cost@example.invalid
      AZURE_TENANT_ID: 00000000-0000-0000-0000-000000000009
      SQL_ENTRA_ADMIN_OBJECT_ID: 00000000-0000-0000-0000-000000000007
      PLATFORM_ADMINISTRATORS_GROUP_OBJECT_ID: 00000000-0000-0000-0000-000000000002
      DEVELOPERS_GROUP_OBJECT_ID: 00000000-0000-0000-0000-000000000003
      OPERATIONS_GROUP_OBJECT_ID: 00000000-0000-0000-0000-000000000004
      SECURITY_READERS_GROUP_OBJECT_ID: 00000000-0000-0000-0000-000000000005
      COST_READERS_GROUP_OBJECT_ID: 00000000-0000-0000-0000-000000000006
      DATABASE_ADMINISTRATORS_GROUP_OBJECT_ID: 00000000-0000-0000-0000-000000000007
      AUDITORS_GROUP_OBJECT_ID: 00000000-0000-0000-0000-000000000008
      PORTFOLIO_PRIMARY_LOCATION: westeurope
      PORTFOLIO_PRIMARY_REGION_CODE: weu
      PORTFOLIO_SECONDARY_LOCATION: northeurope
      PORTFOLIO_SECONDARY_REGION_CODE: neu
      PORTFOLIO_APP_SERVICE_SKU: S1
      PORTFOLIO_SQL_ADMIN_LOGIN: nshop-database-administrators
      PORTFOLIO_BUDGET_START_DATE: '2026-08-01T00:00:00Z'
      PORTFOLIO_BUDGET_END_DATE: '2027-08-01T00:00:00Z'
      PORTFOLIO_ALLOW_TEST_VALUES: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Bicep CLI
        run: az bicep install --version v0.46.1

      - name: Check portfolio shell scripts
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r script; do
            bash -n "$script"
          done < <(find infra/bicep/environments/portfolio -name '*.portfolio.sh' -print | sort)

      - name: Build original infrastructure template
        run: |
          mkdir -p "$RUNNER_TEMP/nshop-portfolio"

          az bicep build \
            --file infra/bicep/main.bicep \
            --outfile "$RUNNER_TEMP/nshop-portfolio/main.json"

      - name: Compile portfolio environment parameters
        run: |
          az bicep build-params \
            --file infra/bicep/environments/portfolio/main.portfolio.bicepparam \
            --outfile "$RUNNER_TEMP/nshop-portfolio/portfolio.parameters.json"

      - name: Enforce portfolio deployment safety policy
        run: bash infra/bicep/environments/portfolio/validate.portfolio.sh

      - name: Run portfolio quota and cleanup regression checks
        run: bash infra/bicep/environments/portfolio/test.portfolio.sh

      - name: Verify existing development and production files remain unchanged
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags --depth=1 origin "$BASE_SHA"

          changed_existing_files="$(
            git diff --name-only --diff-filter=MD "$BASE_SHA" HEAD -- \
              infra/bicep/main.bicep \
              infra/bicep/modules \
              infra/bicep/orchestration \
              infra/bicep/environments/dev \
              infra/bicep/environments/prod \
              scripts \
              .github/workflows/dev-cleanup.yml \
              .github/workflows/dev-deployment.yml \
              .github/workflows/dev-region-qualification.yml \
              .github/workflows/dev-what-if.yml \
              .github/workflows/infrastructure-validation.yml
          )"

          if [[ -n "$changed_existing_files" ]]; then
            printf '::error::Existing project files were changed:\n%s\n' "$changed_existing_files"
            exit 1
          fi

          echo 'PASS: Existing development, production and infrastructure files are unchanged.'
